# Controllo delle proposte (K-015, K-016): il deposito e' pubblico; nel titolo di una proposta, nella sua descrizione e nei
# messaggi dei suoi commit nuovi non c'e' nessuno dei quattro nomi (CLAUDE.md, Confini). Usa lo stesso strumento della
# prova deposito.nomi_e_file, che conosce solo le impronte dei nomi (tests/strumenti/controlla_proposta.sh). I file del
# deposito li controlla quella prova, nel lavoro compila-e-prova del Controllo. Questo controllo sta a parte perche'
# riparte anche quando si cambiano il titolo o la descrizione (edited), senza rifare tutte le prove; dei messaggi controlla
# i commit della proposta che il ramo di arrivo non ha.
name: Nomi della proposta

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  titolo-descrizione-e-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compila lo strumento del controllo
        run: |
          cmake -S . -B build -DKZERO_WERROR=ON
          cmake --build build -j "$(nproc)" --target controlla_deposito
      - name: Nomi nel titolo, nella descrizione e nei messaggi dei commit nuovi
        env:
          # Titolo, descrizione e ramo arrivano come variabili, mai scritti dentro il comando (un testo non deve diventare
          # un comando). Una proposta senza descrizione da' una variabile vuota.
          TITOLO: ${{ github.event.pull_request.title }}
          DESCRIZIONE: ${{ github.event.pull_request.body }}
          RAMO_DI_ARRIVO: ${{ github.base_ref }}
          TESTA: ${{ github.event.pull_request.head.sha }}
        run: tests/strumenti/controlla_proposta.sh build/tests/controlla_deposito "origin/$RAMO_DI_ARRIVO" "$TESTA"
